[project]
name = "tasker"
version = "0.1.0"
description = "Task Management API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]  # the app isn't installed as a package, so make `app` importable
strict = true

[tool.ruff.lint]
# ruff's default rules, plus the FastAPI-specific ones
extend-select = ["FAST"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
